name: CI

# Each project is complete on its own (docs/11-multi-branch.md §8): it installs and tests in its own folder.
on:
  push:
  pull_request:

jobs:
  cross-project-typecheck:
    # The system tests of cloud-hq and the till still import the branch server's code, so this job installs all three.
    # It goes away when those tests become process-based (docs/11-multi-branch.md §8.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/setup.mjs branch-server cloud-hq till
      - run: npm run typecheck:tests

  branch-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: branch-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high # no known serious flaw in what ships
      - run: npm run test:unit
      - run: npm run test:db # includes the backup and restore drill
      - run: npm run test:migration # the real-dump tests skip themselves here; the hand-made-dump tests run

  cloud-hq:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-hq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  till:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: till
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build # the web app must still build
      - run: npm run test:web

  integration:
    # Uses a throwaway SQLite file, so no Docker or services are needed. Enable once the API exists (M1 exit).
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: branch-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run test:integration
