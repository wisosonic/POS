name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run build # the web app must still build
      - run: npm audit --omit=dev --audit-level=high # no known serious flaw in what ships

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:db # includes the backup and restore drill
      - run: npm run test:web
      - run: npm run test:migration # the real-dump tests skip themselves here; the hand-made-dump tests run

  integration:
    # Uses a throwaway SQLite file, so no Docker or services are needed. Enable once the API exists (M1 exit).
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
